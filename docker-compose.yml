services:

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: fittrackpro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Wewalage2004
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/fittrackpro
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Wewalage2004
    depends_on:
      - database

volumes:
  postgres_data: